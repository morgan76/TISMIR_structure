seed: 0
device: auto
output_dir: outputs/train/rwc_pop_benchmark_mert_projection_ce

model:
  name: projection_baseline
  audio:
    input_dim: null
    hidden_dim: 128
    output_dim: 32
  text:
    input_dim: null
    hidden_dim: 128
    output_dim: 32
  similarity:
    temperature: 0.15
    normalize: true

data:
  manifest: data/manifests/rwc_pop_benchmark_train.local.jsonl
  audio_embedding_root: data/embeddings/audio
  audio_encoder: mert
  text_embedding_root: data/embeddings/text
  text_encoder: sentence_transformers
  audio_embedding_key: beat_sync
  namespace: segment_open
  candidate_label_strategy: track_labels
  ignore_index: -100

validation:
  manifest: data/manifests/rwc_pop_benchmark_val.local.jsonl
  segmentation:
    enabled: true
    monitor: F-measure@3.0
    mode: max
    smoothing_window: 7
    smoothing_mode: mean
    decoder: viterbi
    transition_penalty: 4.0
    min_segment_duration: 3.0
    checkpoint_name: best_segmentation_checkpoint.pt

optimization:
  batch_size: 1
  gradient_accumulation_steps: 1
  num_workers: 0
  persistent_workers: false
  prefetch_factor: null
  progress: true
  max_epochs: 120
  learning_rate: 0.0005
  weight_decay: 0.001
  shuffle: true
  lr_scheduler:
    name: reduce_on_plateau
    patience: 2
    factor: 0.5
    min_lr: 0.000001
    threshold: 0.0
  early_stopping:
    patience: 10
    min_delta: 0.0

loss:
  name: frame_label_cross_entropy
  frame_label_weight: 1.0
  segment_balance: true
