seed: 0
device: auto
output_dir: outputs/train/rwc_pop_benchmark_mert_hybrid_ce_link_boundary_section_ids_corpus

model:
  name: temporal_text_adapter
  model_dim: 32
  num_heads: 2
  feedforward_dim: 64
  dropout: 0.2
  audio_adapter:
    input_dim: null
    hidden_dim: null
    positional_encoding:
      type: rope
    num_layers: 1
  text_adapter:
    input_dim: null
    hidden_dim: null
    num_layers: 1
  update_blocks:
    enabled: true
    bidirectional: true
    num_blocks: 1
    num_heads: 2
    relation_attention:
      enabled: true
      edge_dim: 16
      pair_features:
        - cosine
        - probability
      link_cnn:
        kernel_size: 5
        dilations: [1, 2, 4, 8, 16, 32, 64]
        dropout: 0.2
        ema_factor: 4
      gate_init: -4.0
      relative_distance: false
      max_distance: 2048
    boundary_head:
      enabled: true
      hidden_dim: null
    intermediate_logits: false
    return_attention: false
    attention_fusion:
      enabled: false
  structure_head:
    enabled: false
  similarity:
    temperature: 0.15
    normalize: true

data:
  manifest: data/manifests/rwc_pop_benchmark_train.local.jsonl
  audio_embedding_root: data/embeddings/audio
  audio_encoder: mert
  text_embedding_root: data/embeddings/text_rwc_pop_section_ids_corpus
  text_encoder: sentence_transformers
  audio_embedding_key: beat_sync
  namespace: segment_open
  candidate_label_strategy: track_labels
  annotation_processing:
    policy: section_ids_corpus
    section_id_mapping_path: configs/annotation_mappings/rwc_pop_section_ids_corpus_seed0.json
    section_id_preserve_labels:
      - silence
  ignore_index: -100

validation:
  manifest: data/manifests/rwc_pop_benchmark_val.local.jsonl
  segmentation:
    enabled: true
    monitor: F-measure@3.0
    mode: max
    smoothing_window: 7
    smoothing_mode: mean
    decoder: viterbi
    transition_penalty: 4.0
    min_segment_duration: 3.0
    boundary_decoding:
      enabled: true
      weight: 3.0
      eps: 0.0001
    checkpoint_name: best_segmentation_checkpoint.pt

optimization:
  batch_size: 1
  gradient_accumulation_steps: 1
  num_workers: 0
  persistent_workers: false
  prefetch_factor: null
  progress: true
  max_epochs: 120
  learning_rate: 0.0005
  weight_decay: 0.001
  shuffle: true
  lr_scheduler:
    name: reduce_on_plateau
    patience: 2
    factor: 0.5
    min_lr: 0.000001
    threshold: 0.0
  early_stopping:
    patience: 10
    min_delta: 0.0

loss:
  name: frame_label_cross_entropy
  frame_label_weight: 1.0
  link_relation:
    weight: 1.0
    balance: true
  boundary:
    weight: 1.0
  segment_balance: true
