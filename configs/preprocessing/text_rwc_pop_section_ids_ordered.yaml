output_root: data/embeddings/text_rwc_pop_section_ids_ordered
scope: dataset

text_encoder:
  name: sentence_transformers
  checkpoint: intfloat/e5-base-v2
  device: null
  normalize_embeddings: true
  batch_size: 32

prompt:
  mode: bare
  normalize_whitespace: true

annotation_processing:
  policy: section_ids_ordered
  section_id_prefix: section
