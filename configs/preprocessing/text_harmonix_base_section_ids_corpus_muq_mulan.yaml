output_root: data/embeddings/text_harmonix_base_section_ids_corpus_muq_mulan
scope: dataset

text_encoder:
  name: muq_mulan
  checkpoint: OpenMuQ/MuQ-MuLan-large
  device: null
  normalize_embeddings: true
  batch_size: 16

prompt:
  mode: bare
  normalize_whitespace: true

label_normalization:
  name: generic
  normalize_whitespace: true

annotation_processing:
  policy: section_ids_corpus
  source_annotation_processing:
    policy: base_labels
  section_id_mapping_path: configs/annotation_mappings/harmonix_section_ids_corpus_base_labels_seed0.json
  section_id_preserve_labels:
    - silence
