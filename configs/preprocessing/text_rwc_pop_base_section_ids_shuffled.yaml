output_root: data/embeddings/text_rwc_pop_base_section_ids_shuffled
scope: dataset

text_encoder:
  name: sentence_transformers
  checkpoint: intfloat/e5-base-v2
  device: null
  normalize_embeddings: true
  batch_size: 32

prompt:
  mode: bare
  normalize_whitespace: true

annotation_processing:
  policy: section_ids_shuffled
  source_annotation_processing:
    policy: base_labels
  section_id_prefix: section
  section_id_seed: 0
