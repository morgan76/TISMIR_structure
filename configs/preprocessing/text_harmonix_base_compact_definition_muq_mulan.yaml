output_root: data/embeddings/text_harmonix_base_compact_definition_muq_mulan
scope: dataset

text_encoder:
  name: muq_mulan
  checkpoint: OpenMuQ/MuQ-MuLan-large
  device: null
  normalize_embeddings: true
  batch_size: 16

prompt:
  mode: compact_occurrence_definition
  normalize_whitespace: true

label_normalization:
  name: harmonix
  normalize_whitespace: true
  disambiguate_duplicates: true

annotation_processing:
  policy: base_labels
