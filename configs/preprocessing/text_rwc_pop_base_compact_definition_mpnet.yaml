output_root: data/embeddings/text_rwc_pop_base_compact_definition_mpnet
scope: dataset

text_encoder:
  name: sentence_transformers
  checkpoint: sentence-transformers/all-mpnet-base-v2
  device: null
  normalize_embeddings: true
  batch_size: 32

prompt:
  mode: compact_occurrence_definition
  normalize_whitespace: true

annotation_processing:
  policy: base_labels
